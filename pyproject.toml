[project]
name = "chess-engine"
version = "0.1.0"
description = "UCI chess engine in Python with alpha-beta search and an NNUE evaluation trained on Lichess data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chess>=1.11.2",
    "numpy>=2.5.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
train = [
    "torch>=2.15.0",
    "zstandard>=0.25.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
